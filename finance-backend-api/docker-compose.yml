version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: finance_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 11223344
      MYSQL_DATABASE: financedb
      MYSQL_USER: finuser
      MYSQL_PASSWORD: finpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "finuser", "-pfinpass" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s

  api:
    build: .
    container_name: finance_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+pymysql://finuser:finpass@mysql:3306/financedb
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
    command:
      - sh
      - -c
      - |
        python - <<'PY'
        import sys
        import time

        import pymysql

        deadline = time.time() + 90

        while True:
            try:
                connection = pymysql.connect(
                    host="mysql",
                    user="finuser",
                    password="finpass",
                    database="financedb",
                )
                connection.close()
                break
            except Exception as exc:
                if time.time() >= deadline:
                    print(f"MySQL did not become ready: {exc}", file=sys.stderr)
                    sys.exit(1)
                time.sleep(2)
        PY
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
